language: cpp

sources:
  googleapis:
    commit: 46403a9acec0719c130b33eb38b2ee62a45f9f6c

libraries:
  - name: google-cloud-secretmanager-v1
    copyright_year: "2021"
    apis:
      - path: google/cloud/secretmanager/v1/service.proto
    roots:
      - googleapis
    cpp:
      product_path: google/cloud/secretmanager/v1
      forwarding_product_path: google/cloud/secretmanager
      initial_copyright_year: "2021"
      retryable_status_codes:
        - kUnavailable

  - name: google-cloud-compute-addresses-v1
    copyright_year: "2023"
    apis:
      - path: google/cloud/compute/addresses/v1/addresses.proto
    roots:
      - discovery
      - googleapis
    cpp:
      product_path: google/cloud/compute/addresses/v1
      initial_copyright_year: "2023"
      service_endpoint_env_var: GOOGLE_CLOUD_CPP_ADDRESSES_ENDPOINT
      is_discovery_document_proto: true
      generate_rest_transport: true
      generate_grpc_transport: false
      retryable_status_codes:
        - kUnavailable
